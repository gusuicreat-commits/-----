<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重器科普 · 资料约束视频智能体</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23f97316'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='sans-serif' font-size='44' font-weight='700' fill='white'%3E%E9%87%8D%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"><script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark">重</span><div><h1>重器科普 <span>· 资料约束视频智能体</span></h1><p>设备结构有依据 · 技术参数有出处 · 每个镜头可溯源</p></div></div><a href="/create.html" class="button primary" style="white-space:nowrap">＋ 创建视频</a><div class="project-controls"><select id="project-select" aria-label="当前项目"><option value="">选择项目</option></select><button data-action="seed">载入示例项目</button></div><div class="run-controls"><button id="director-settings-open" disabled>讲解方式</button><button id="generate" class="primary" disabled>▶ 生成视频</button><label class="render-style">画面风格 <select id="render-mode" aria-label="画面风格" aria-describedby="render-mode-hint"><option value="standard">标准（网页三维，快）</option><option value="scale_film">尺度短片（样片风格，15–30秒）</option><option value="photoreal">写实（Blender，慢，约每秒画面 1 分钟）</option></select><small id="render-mode-hint" role="status"></small></label><select id="rerun-stage" aria-label="重跑起点"></select><button id="rerun" disabled>重跑</button><button id="open-film" disabled>打开成片 ↗</button><button class="danger" data-action="force" hidden>强制继续</button><span id="run-status" class="pill pending" role="status">等待资料</span></div></header>
<nav id="pipeline" aria-label="制作流水线"></nav>
<div id="block-banner" class="block-banner" hidden></div>
<main class="workspace">
<section class="panel resources"><header class="panel-heading"><h2><span class="section-no">01</span> 资料</h2><span class="eyebrow">依据与来源</span></header><nav class="tabs" aria-label="资料分类"><button role="tab" aria-selected="true" data-tab="facts">参数表</button><button role="tab" aria-selected="false" data-tab="docs">文档</button><button role="tab" aria-selected="false" data-tab="assets">素材</button><button role="tab" aria-selected="false" data-tab="model">模型</button></nav><div id="resource-content" class="panel-scroll"></div></section>
<section class="panel studio"><header class="panel-heading"><h2><span class="section-no">02</span> 成片与分镜</h2><span class="eyebrow">每个镜头都有依据</span></header><div class="studio-scroll"><div id="preview"></div><div id="film-links" class="film-links"></div><div class="timeline-heading"><h3>分镜时间轴 <span id="shot-count" class="muted"></span></h3><div class="legend"><span class="model">● 模型</span><span class="real">● 实拍</span><span class="ai">● AI</span><span>● 信息图</span></div></div><div id="timeline" class="timeline" aria-label="分镜时间轴"></div><div id="shot-detail"></div></div></section>
<aside class="panel agent"><header class="panel-heading"><h2><span class="section-no">03</span> 智能体</h2><span id="connection" class="muted">等待连接</span></header><div class="tool-heading"><h3>工具调用实时流</h3><p id="tool-count" class="muted">大模型 0 次 · 程序工具 0 次 · 总耗时 0.0 秒 · 费用待统计</p></div><div id="event-stream" class="event-stream" aria-live="polite"><p class="empty-note">准备好资料后，智能体将在这里展示每一步工具调用。</p></div><div class="agent-bottom"><h3>校验问题 <span id="issue-count" class="muted">0</span></h3><div id="issues"></div><h3>产出物</h3><div id="outputs"></div></div></aside>
</main><div id="toasts" aria-live="assertive"></div><script type="module" src="/app.js"></script>
<dialog id="director-settings" aria-labelledby="director-title"><form id="director-form">
<h2 id="director-title">先讲清一个问题</h2><p class="muted">根据已确认资料安排镜头；缺少依据的内容会列为待补充。</p>
<label for="director-recipe">讲解重点</label><select id="director-recipe" name="director_recipe"><option value="off">原有综合分镜</option><option value="auto">按需求与资料选择</option><option value="scale">尺度：到底有多大</option><option value="motion">运动：哪个部件怎样动</option><option value="structure">结构：各部件怎样配合</option></select>
<label for="director-duration">目标时长（秒）</label><input id="director-duration" name="target_s" type="number" min="10" max="120" step="1" required value="45">
<p id="director-guidance" class="muted">15秒建议聚焦一个重点。保存后从“分镜规划”重跑，已人工确认的镜头保留。</p>
<p id="director-settings-error" role="alert"></p><div class="actions"><button type="button" id="director-settings-close">取消</button><button class="primary" id="director-settings-save" type="submit">保存讲解方式</button></div>
</form></dialog></body></html>
