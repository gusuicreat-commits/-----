<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重器科普 · 资料约束视频智能体</title><link rel="stylesheet" href="/style.css"><script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark">重</span><div><h1>重器科普 <span>· 资料约束视频智能体</span></h1><p>设备结构有依据 · 技术参数有出处 · 每个镜头可溯源</p></div></div><div class="project-controls"><select id="project-select" aria-label="当前项目"><option value="">选择项目</option></select><button data-action="seed">载入示例项目</button></div><div class="run-controls"><button id="generate" class="primary" disabled>▶ 生成视频</button><select id="rerun-stage" aria-label="重跑起点"></select><button id="rerun" disabled>重跑</button><button class="danger" data-action="force" hidden>强制继续</button><span id="run-status" class="pill pending" role="status">等待资料</span></div></header>
<nav id="pipeline" aria-label="制作流水线"></nav>
<div id="block-banner" class="block-banner" hidden></div>
<main class="workspace">
<section class="panel resources"><header class="panel-heading"><h2><span class="section-no">01</span> 资料</h2><span class="eyebrow">依据与来源</span></header><nav class="tabs" aria-label="资料分类"><button role="tab" aria-selected="true" data-tab="facts">参数表</button><button role="tab" aria-selected="false" data-tab="docs">文档</button><button role="tab" aria-selected="false" data-tab="assets">素材</button><button role="tab" aria-selected="false" data-tab="model">模型</button></nav><div id="resource-content" class="panel-scroll"></div></section>
<section class="panel studio"><header class="panel-heading"><h2><span class="section-no">02</span> 成片与分镜</h2><span class="eyebrow">每个镜头都有依据</span></header><div class="studio-scroll"><div id="preview"></div><div id="film-links" class="film-links"></div><div class="timeline-heading"><h3>分镜时间轴 <span id="shot-count" class="muted"></span></h3><div class="legend"><span class="model">● 模型</span><span class="real">● 实拍</span><span class="ai">● AI</span><span>● 信息图</span></div></div><div id="timeline" class="timeline" aria-label="分镜时间轴"></div><div id="shot-detail"></div></div></section>
<aside class="panel agent"><header class="panel-heading"><h2><span class="section-no">03</span> 智能体</h2><span id="connection" class="muted">等待连接</span></header><div class="tool-heading"><h3>工具调用实时流</h3><p id="tool-count" class="muted">已调用 0 次工具 · 其中大模型 0 次</p></div><div id="event-stream" class="event-stream" aria-live="polite"><p class="empty-note">准备好资料后，智能体将在这里展示每一步工具调用。</p></div><div class="agent-bottom"><h3>校验问题 <span id="issue-count" class="muted">0</span></h3><div id="issues"></div><h3>产出物</h3><div id="outputs"></div></div></aside>
</main><div id="toasts" aria-live="assertive"></div><script type="module" src="/app.js"></script>
</body></html>
